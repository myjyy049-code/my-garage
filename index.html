<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイガレージ</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マイガレージ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Leaflet.js (OSM) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface2: #1a1a1a;
  --border: #222222;
  --accent: #ff6b00;
  --accent2: #ff9500;
  --text: #f0f0f0;
  --text2: #888888;
  --engine: #ff4444;
  --drive: #44aaff;
  --electric: #ffdd00;
  --fuel: #00ff88;
  --success: #44ff88;
  --danger: #ff4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }
#login-screen {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 0%, #1a0a00 0%, #0a0a0a 70%);
  padding: 2rem;
}
.login-logo { font-family: 'Rajdhani', sans-serif; font-size: 3.5rem; font-weight: 700; letter-spacing: 0.2em; color: var(--accent); text-shadow: 0 0 40px rgba(255,107,0,0.5); margin-bottom: 0.5rem; }
.login-sub { color: var(--text2); font-size: 0.85rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 0.5rem; }
.login-club { color: var(--accent); font-family: 'Rajdhani', sans-serif; font-size: 1rem; letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 3rem; opacity: 0.8; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--accent); padding: 2.5rem; width: 100%; max-width: 380px; border-radius: 4px; }
.login-card h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; margin-bottom: 1.5rem; color: var(--text2); text-transform: uppercase; }
.google-btn { width: 100%; padding: 0.9rem; background: #fff; color: #333; border: none; border-radius: 4px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.75rem; transition: opacity 0.2s; }
.google-btn:hover { opacity: 0.9; }
.google-icon { width: 20px; height: 20px; }
#app-screen { display: none; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-logo { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--accent); letter-spacing: 0.15em; }
.header-user { display: flex; align-items: center; gap: 0.75rem; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #000; }
.logout-btn { background: none; border: 1px solid var(--border); color: var(--text2); padding: 0.3rem 0.8rem; border-radius: 3px; font-size: 0.8rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all 0.2s; }
.logout-btn:hover { border-color: var(--accent); color: var(--accent); }
.main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
.bike-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
.bike-list-item {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border); border-radius: 4px;
  padding: 1rem 1.25rem; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  transition: all 0.2s;
}
.bike-list-item:hover { border-left-color: var(--accent); }
.bike-list-item.active { border-left-color: var(--accent); background: var(--surface2); }
.bike-list-name { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.bike-list-meta { font-size: 0.8rem; color: var(--text2); margin-top: 0.2rem; }
.bike-list-actions { display: flex; gap: 0.5rem; }
.bike-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 1.5rem; margin-bottom: 1.5rem; }
.bike-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
.bike-name { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
.bike-meta { color: var(--text2); font-size: 0.85rem; margin-top: 0.2rem; }
.edit-btn { background: none; border: 1px solid var(--border); color: var(--text2); padding: 0.4rem 0.9rem; border-radius: 3px; font-size: 0.8rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all 0.2s; }
.edit-btn:hover { border-color: var(--accent); color: var(--accent); }
.bike-specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
.spec-item label { display: block; font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
.spec-item span { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 600; }
.no-bike { text-align: center; padding: 3rem; color: var(--text2); }
.register-btn { background: var(--accent); color: #000; border: none; padding: 0.8rem 2rem; border-radius: 3px; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; margin-top: 1rem; transition: opacity 0.2s; }
.register-btn:hover { opacity: 0.85; }
.add-bike-btn { background: none; border: 1px dashed var(--border); color: var(--text2); padding: 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; width: 100%; text-align: center; transition: all 0.2s; margin-bottom: 1.5rem; }
.add-bike-btn:hover { border-color: var(--accent); color: var(--accent); }
.sort-control { margin-bottom: 1rem; }
.sort-control select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.9rem; border-radius: 3px; font-size: 0.85rem; font-family: 'Noto Sans JP', sans-serif; outline: none; transition: border-color 0.2s; width: 100%; max-width: 300px; }
.sort-control select:focus { border-color: var(--accent); }
.tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.tab { padding: 0.75rem 1.25rem; background: none; border: none; color: var(--text2); font-size: 0.9rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-dot { width: 8px; height: 8px; border-radius: 50%; }
.tab-dot.engine { background: var(--engine); }
.tab-dot.drive { background: var(--drive); }
.tab-dot.electric { background: var(--electric); }
.tab-dot.fuel { background: var(--fuel); }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.section-title { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
.add-btn { background: var(--accent); color: #000; border: none; padding: 0.5rem 1rem; border-radius: 3px; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: opacity 0.2s; }
.add-btn:hover { opacity: 0.85; }
.record-list { display: flex; flex-direction: column; gap: 0.75rem; }
.record-item { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1rem 1.25rem; display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; align-items: start; }
.record-title { font-weight: 500; font-size: 0.95rem; }
.record-meta { font-size: 0.8rem; color: var(--text2); margin-top: 0.25rem; display: flex; flex-wrap: wrap; gap: 1rem; }
.record-date { font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; color: var(--text2); text-align: right; }
.delete-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1rem; padding: 0.2rem; transition: color 0.2s; align-self: center; margin-left: 0.5rem; }
.delete-btn:hover { color: var(--danger); }
.empty-msg { text-align: center; padding: 2rem; color: var(--text2); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: 4px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 4px; padding: 2rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.5rem; }
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
.form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.7rem 0.9rem; border-radius: 3px; font-size: 0.9rem; font-family: 'Noto Sans JP', sans-serif; outline: none; transition: border-color 0.2s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group select option { background: var(--surface2); }
.form-group textarea { resize: vertical; min-height: 80px; }
.modal-btns { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }
.btn-cancel { background: none; border: 1px solid var(--border); color: var(--text2); padding: 0.6rem 1.2rem; border-radius: 3px; font-size: 0.9rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
.btn-save { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.5rem; border-radius: 3px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: opacity 0.2s; }
.btn-save:hover { opacity: 0.85; }
.btn-danger { background: var(--danger); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 3px; font-size: 0.9rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
.loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: var(--accent); letter-spacing: 0.2em; }
.back-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 0.85rem; font-family: 'Noto Sans JP', sans-serif; padding: 0.5rem 0; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; transition: color 0.2s; }
.back-btn:hover { color: var(--accent); }
.menu-btn { background: none; border: 1px dashed var(--border); color: var(--text2); padding: 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; width: 100%; text-align: center; transition: all 0.2s; margin-bottom: 0.75rem; }
.menu-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ===== ツーリング中画面 ===== */
#touring-live-section { display: none; }
.touring-live-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 1rem 1.25rem;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.touring-live-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.touring-stat { text-align: center; }
.touring-stat-value { font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; }
.touring-stat-label { font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.2rem; }
.touring-live-actions { display: flex; gap: 0.75rem; align-items: center; }
.btn-fuel { background: var(--surface2); border: 1px solid var(--border); color: var(--fuel); padding: 0.6rem 1rem; border-radius: 3px; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all 0.2s; }
.btn-fuel:hover { border-color: var(--fuel); background: rgba(0,255,136,0.1); }
.btn-stop { background: var(--danger); color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 3px; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: opacity 0.2s; }
.btn-stop:hover { opacity: 0.85; }
.participants-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.75rem 1rem;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.85rem;
  color: var(--text2);
  flex-wrap: wrap;
}
.participant-dot {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.25rem 0.75rem;
  font-size: 0.8rem;
}
.participant-dot.me { border-color: var(--accent); color: var(--accent); }
.participant-dot.other { border-color: var(--success); color: var(--success); }
#touring-live-map {
  width: 100%;
  height: 60vh;
  min-height: 300px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

/* ツーリング記録一覧の地図ボタン */
.map-view-btn {
  background: none;
  border: 1px solid var(--drive);
  color: var(--drive);
  padding: 0.4rem 0.8rem;
  border-radius: 3px;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: all 0.2s;
}
.map-view-btn:hover { background: rgba(68,170,255,0.1); }

/* ツーリング記録の地図モーダル */
#touring-map-modal { z-index: 1100; }
#stop-touring-modal { z-index: 1100; }
#touring-record-map {
  width: 100%;
  height: 400px;
  border-radius: 4px;
  border: 1px solid var(--border);
  margin-top: 1rem;
}

/* Leafletのダークテーマ調整 */
.leaflet-container { background: #1a1a1a; }
.leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.leaflet-popup-tip { background: var(--surface); }

@media (max-width: 600px) {
  .main { padding: 1rem; }
  .tab { padding: 0.6rem 0.9rem; font-size: 0.82rem; }
  .bike-name { font-size: 1.4rem; }
  #touring-live-map { height: 50vh; }
  .touring-live-header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="loading" id="loading">LOADING...</div>

<div id="login-screen" style="display:none">
  <div class="login-logo">MY GARAGE</div>
  <div class="login-sub">バイクメンテナンス管理</div>
  <div class="login-club">⛓ Chainon Riders</div>
  <div class="login-card">
    <h2>サインイン</h2>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Googleでログイン
    </button>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="header">
    <div>
      <div class="header-logo">MY GARAGE</div>
      <div style="font-size:0.7rem;color:var(--accent);letter-spacing:0.2em;opacity:0.7">⛓ CHAINON RIDERS</div>
    </div>
    <div class="header-user">
      <div class="avatar" id="user-avatar">U</div>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="main">

    <!-- バイク一覧画面 -->
    <div id="bike-list-section">
      <button class="menu-btn" onclick="showTouringList()">🏍️ ツーリング記録</button>
      <button class="menu-btn" onclick="startTouring()">▶ ツーリング開始</button>
      <div class="sort-control">
        <select id="bike-sort" onchange="sortBikes()">
          <option value="date-desc">登録日（新しい順）</option>
          <option value="date-asc">登録日（古い順）</option>
          <option value="name-asc">車名（あいうえお順）</option>
          <option value="name-desc">車名（逆順）</option>
          <option value="year-desc">年式（新しい順）</option>
          <option value="year-asc">年式（古い順）</option>
        </select>
      </div>
      <div id="bike-list"></div>
      <button class="add-bike-btn" onclick="openBikeModal()">＋ バイクを追加</button>
    </div>

    <!-- ツーリング記録一覧画面 -->
    <div id="touring-section" style="display:none">
      <button class="back-btn" onclick="showBikeList()">‹ バイク一覧に戻る</button>
      <h2 style="margin-bottom:1rem;">🏍️ ツーリング記録</h2>
      <button class="add-bike-btn" onclick="openTouringModal()">＋ ツーリング追加</button>
      <div id="touring-list"></div>
    </div>

    <!-- ツーリング中画面（GPS + 位置共有 + OSM） -->
    <div id="touring-live-section">
      <button class="back-btn" onclick="confirmStopTouring()">‹ 戻る</button>

      <div class="touring-live-header">
        <div class="touring-live-stats">
          <div class="touring-stat">
            <div class="touring-stat-value" id="live-distance">0.0</div>
            <div class="touring-stat-label">km 走行</div>
          </div>
          <div class="touring-stat">
            <div class="touring-stat-value" id="live-time">00:00</div>
            <div class="touring-stat-label">経過時間</div>
          </div>
          <div class="touring-stat">
            <div class="touring-stat-value" id="live-members">1</div>
            <div class="touring-stat-label">参加人数</div>
          </div>
        </div>
        <div class="touring-live-actions">
          <button class="btn-fuel" onclick="searchGasStation()">⛽ 給油検索</button>
          <button class="btn-stop" onclick="confirmStopTouring()">⏹ 終了</button>
        </div>
      </div>

      <div class="participants-bar" id="participants-bar">
        <span>参加者:</span>
        <span id="participants-list"></span>
      </div>

      <div id="touring-live-map"></div>
    </div>

    <!-- バイク詳細＆メンテ記録画面 -->
    <div id="bike-detail-section" style="display:none">
      <button class="back-btn" onclick="showBikeList()">‹ バイク一覧に戻る</button>
      <div id="bike-detail-card"></div>
      <div id="records-section">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('engine', this)"><span class="tab-dot engine"></span>エンジン系</button>
          <button class="tab" onclick="switchTab('drive', this)"><span class="tab-dot drive"></span>駆動系</button>
          <button class="tab" onclick="switchTab('electric', this)"><span class="tab-dot electric"></span>電気系</button>
          <button class="tab" onclick="switchTab('fuel', this)"><span class="tab-dot fuel"></span>燃費計算</button>
        </div>
        <div class="section-header">
          <div class="section-title" id="current-category-label">エンジン系</div>
          <button class="add-btn" onclick="openAddRecord()">＋ 記録追加</button>
        </div>
        <div class="record-list" id="record-list"></div>
      </div>
    </div>

  </div>
</div>

<!-- バイク登録/編集モーダル -->
<div class="modal-overlay" id="bike-modal">
  <div class="modal">
    <h3 id="bike-modal-title">バイク登録</h3>
    <div class="form-group"><label>車種・車名</label><input type="text" id="bike-name" placeholder="例：Honda CB400SF"></div>
    <div class="form-group"><label>年式</label><input type="number" id="bike-year" placeholder="例：2020"></div>
    <div class="form-group"><label>排気量 (cc)</label><input type="number" id="bike-cc" placeholder="例：400"></div>
    <div class="form-group"><label>現在の走行距離 (km)</label><input type="number" id="bike-km" placeholder="例：12500"></div>

</div>

<!-- メンテ記録モーダル -->
<div class="modal-overlay" id="record-modal">
  <div class="modal">
    <h3>メンテ記録を追加</h3>
    <div class="form-group"><label>カテゴリ</label>
      <select id="record-category" onchange="toggleFuelFields()">
        <option value="engine">エンジン系</option>
        <option value="drive">駆動系</option>
        <option value="electric">電気系</option>
        <option value="fuel">燃費計算</option>
      </select>
    </div>
    <div class="form-group"><label>作業内容</label><input type="text" id="record-title" placeholder="例：エンジンオイル交換"></div>
    <div class="form-group"><label>実施日</label><input type="date" id="record-date"></div>
    <div id="fuel-fields" style="display:none;">
      <div class="form-group"><label>走行前距離 (km)</label><input type="number" id="record-km-before" placeholder="例：12000"></div>
      <div class="form-group"><label>走行後距離 (km)</label><input type="number" id="record-km-after" placeholder="例：12500"></div>

        <div id="fuel-efficiency-display" style="padding:10px;background:#1a2a1a;border-radius:4px;font-weight:bold;color:var(--fuel);border:1px solid #2a4a2a;">燃費: 未計算</div>
      </div>

      <div class="form-group"><label>走行距離 (km)</label><input type="number" id="record-km" placeholder="例：12500"></div>
      <div class="form-group"><label>次回予定距離 (km) ※任意</label><input type="number" id="record-next-km" placeholder="例：15500"></div>
      <div class="form-group"><label>メモ</label><textarea id="record-memo" placeholder="使用したパーツ、費用など"></textarea></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRecordModal()">キャンセル</button>
      <button class="btn-save" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- ツーリング追加モーダル -->
<div class="modal-overlay" id="touring-modal">
  <div class="modal">
    <h3 id="touring-modal-title">ツーリング記録を追加</h3>
    <div class="form-group"><label>日付</label><input type="date" id="touring-date"></div>
    <div class="form-group"><label>目的地</label><input type="text" id="touring-destination" placeholder="例：富士山スカイライン"></div>
    <div class="form-group"><label>ルート ※任意</label><input type="text" id="touring-route" placeholder="例：御殿場IC → 富士山 → 山中湖"></div>
    <div class="form-group"><label>走行距離 (km) ※任意</label><input type="number" id="touring-distance" placeholder="例：150"></div>
    <div class="form-group">
      <label>使用バイク ※任意</label>
      <select id="touring-bike"></select>
    </div>
    <div class="form-group"><label>同行者 ※任意</label><input type="text" id="touring-companions" placeholder="例：山田さん、田中さん"></div>
    <div class="form-group"><label>メモ ※任意</label><textarea id="touring-memo" placeholder="立ち寄ったスポット、食べたものなど"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTouringModal()">キャンセル</button>
      <button class="btn-save" onclick="saveTouring()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="stop-touring-modal">

    <p style="color:var(--text2);font-size:0.9rem;margin-bottom:1.5rem;">走行記録を保存しますか？</p>

      <button class="btn-cancel" onclick="stopTouringWithoutSave()">保存せず終了</button>

<!-- ツーリング記録の地図表示モーダル -->
<div class="modal-overlay" id="touring-map-modal">
  <div class="modal" style="max-width:700px;">
    <h3 id="touring-map-title">ルートマップ</h3>
    <div id="touring-record-map"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTouringMapModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://owgoceocaeututmtecsz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BRnWD14z9rBwpwmAaj-FZw_WiccwQiC';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentTab = 'engine';
let bikesData = [];
let selectedBike = null;
let editingTouringId = null;

// ===== ツーリングライブ用変数 =====
let liveMap = null;
let liveMyMarker = null;
let liveRoutePolyline = null;
let liveGpsCoords = [];          // GPSログ（座標配列）
let liveMemberMarkers = {};      // 仲間のマーカー
let liveStartTime = null;
let liveTimerInterval = null;
let liveLocationWatchId = null;
let liveLocationUpdateInterval = null;
let liveParticipantsInterval = null;
let liveTotalDistance = 0;
let liveLastCoord = null;
let isTouring = false;

// ツーリング記録地図用
let recordMap = null;

const categoryLabels = { engine: 'エンジン系', drive: '駆動系', electric: '電気系', fuel: '燃費計算' };

// ===== 初期化 =====
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; showApp(); }
  else { showLogin(); }
  sb.auth.onAuthStateChange((event, session) => {
    if (session) { currentUser = session.user; showApp(); }
    else { currentUser = null; showLogin(); }
  });
}

function showLogin() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}

async function showApp() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  const name = currentUser.user_metadata?.full_name || currentUser.email || 'U';
  document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
  await loadBikes();
}

async function loginWithGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
}

async function logout() { await sb.auth.signOut(); }

// ===== 画面切り替えヘルパー =====
function hideAllSections() {
  ['bike-list-section','touring-section','touring-live-section','bike-detail-section'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

// ===== バイク一覧 =====
async function loadBikes() {
  const { data } = await sb.from('bikes').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true });
  bikesData = data || [];
  sortBikes();
}

function sortBikes() {
  const sortType = document.getElementById('bike-sort')?.value || 'date-desc';
  const sorted = [...bikesData];
  switch(sortType) {
    case 'date-desc': sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); break;
    case 'date-asc':  sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); break;
    case 'name-asc':  sorted.sort((a, b) => (a.name||'').localeCompare(b.name||'','ja')); break;
    case 'name-desc': sorted.sort((a, b) => (b.name||'').localeCompare(a.name||'','ja')); break;
    case 'year-desc': sorted.sort((a, b) => (b.year||0)-(a.year||0)); break;
    case 'year-asc':  sorted.sort((a, b) => (a.year||0)-(b.year||0)); break;
  }
  bikesData = sorted;
  renderBikeList();
}

function renderBikeList() {
  const list = document.getElementById('bike-list');
  if (bikesData.length === 0) {
    list.innerHTML = `<div class="no-bike"><div style="font-size:2rem;margin-bottom:0.5rem">🏍️</div><div>バイクがまだ登録されていません</div></div>`;
    return;
  }
  list.innerHTML = bikesData.map(bike => `
    <div class="bike-list-item" onclick="selectBike('${bike.id}')">
      <div>
        <div class="bike-list-name">${bike.name}</div>
        <div class="bike-list-meta">${bike.year||''}年式 ${bike.cc?bike.cc+'cc':''} ${bike.km?bike.km.toLocaleString()+'km':''}</div>
      </div>
      <div style="color:var(--text2);font-size:1.2rem;">›</div>
    </div>`).join('');
}

function selectBike(bikeId) {
  selectedBike = bikesData.find(b => b.id === bikeId);
  hideAllSections();
  document.getElementById('bike-detail-section').style.display = 'block';
  renderBikeDetail();
  currentTab = 'engine';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.getElementById('current-category-label').textContent = 'エンジン系';
  loadRecords();
}

function showBikeList() {
  selectedBike = null;
  hideAllSections();
  document.getElementById('bike-list-section').style.display = 'block';
  loadBikes();
}

function renderBikeDetail() {
  document.getElementById('bike-detail-card').innerHTML = `
    <div class="bike-card">
      <div class="bike-card-header">
        <div>
          <div class="bike-name">${selectedBike.name}</div>
          <div class="bike-meta">${selectedBike.year||''}年式</div>
        </div>
        <button class="edit-btn" onclick="openBikeModal(true)">編集</button>
      </div>
      <div class="bike-specs">
        <div class="spec-item"><label>排気量</label><span>${selectedBike.cc||'-'} cc</span></div>
        <div class="spec-item"><label>走行距離</label><span>${selectedBike.km?selectedBike.km.toLocaleString():'-'} km</span></div>
        ${selectedBike.memo?`<div class="spec-item" style="grid-column:1/-1"><label>メモ</label><span style="font-family:inherit;font-size:0.9rem">${selectedBike.memo}</span></div>`:''}
      </div>
    </div>`;
}

function openBikeModal(isEdit=false) {
  document.getElementById('bike-modal-title').textContent = isEdit ? 'バイク情報を編集' : 'バイクを追加';
  document.getElementById('bike-delete-btn').style.display = isEdit ? 'block' : 'none';
  if (isEdit && selectedBike) {
    document.getElementById('bike-name').value = selectedBike.name||'';
    document.getElementById('bike-year').value = selectedBike.year||'';
    document.getElementById('bike-cc').value = selectedBike.cc||'';
    document.getElementById('bike-km').value = selectedBike.km||'';
    document.getElementById('bike-memo').value = selectedBike.memo||'';
  } else {
    ['bike-name','bike-year','bike-cc','bike-km','bike-memo'].forEach(id => document.getElementById(id).value='');
  }
  document.getElementById('bike-modal').classList.add('open');
}

function closeBikeModal() { document.getElementById('bike-modal').classList.remove('open'); }

async function saveBike() {
  const payload = {
    user_id: currentUser.id,
    name: document.getElementById('bike-name').value,
    year: parseInt(document.getElementById('bike-year').value)||null,
    cc:   parseInt(document.getElementById('bike-cc').value)||null,
    km:   parseInt(document.getElementById('bike-km').value)||null,
    memo: document.getElementById('bike-memo').value
  };
  if (selectedBike && document.getElementById('bike-modal-title').textContent==='バイク情報を編集') {
    await sb.from('bikes').update(payload).eq('id', selectedBike.id);
    selectedBike = {...selectedBike,...payload};
    closeBikeModal();
    renderBikeDetail();
  } else {
    await sb.from('bikes').insert(payload);
    closeBikeModal();
    await loadBikes();
  }
}

async function deleteBike() {
  if (!confirm(`「${selectedBike.name}」を削除しますか？メンテ記録も全て削除されます。`)) return;
  await sb.from('maintenance_records').delete().eq('bike_id', selectedBike.id);
  await sb.from('bikes').delete().eq('id', selectedBike.id);
  closeBikeModal();
  showBikeList();
}

// ===== メンテ記録 =====
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('current-category-label').textContent = categoryLabels[tab];
  loadRecords();
}

async function loadRecords() {
  const { data } = await sb.from('maintenance_records')
    .select('*').eq('user_id', currentUser.id).eq('bike_id', selectedBike.id)
    .eq('category', currentTab).order('date', { ascending: false });
  renderRecords(data||[]);
}

function renderRecords(records) {
  const list = document.getElementById('record-list');
  if (records.length===0) {
    list.innerHTML = `<div class="empty-msg">まだ記録がありません。「＋ 記録追加」から追加してください。</div>`;
    return;
  }
  list.innerHTML = records.map(r => `
    <div class="record-item">
      <div>
        <div class="record-title">${r.title}</div>
        <div class="record-meta">
          ${r.km?`<span>📍 ${r.km.toLocaleString()} km</span>`:''}
          ${r.next_km?`<span>🔜 次回: ${r.next_km.toLocaleString()} km</span>`:''}
          ${r.memo?`<span>📝 ${r.memo}</span>`:''}
        </div>
      </div>
      <div>
        <div class="record-date">${r.date||''}</div>
        <button class="delete-btn" onclick="deleteRecord('${r.id}')">🗑</button>
      </div>
    </div>`).join('');
}

function openAddRecord() {
  document.getElementById('record-category').value = currentTab;
  document.getElementById('record-date').value = new Date().toISOString().split('T')[0];
  ['record-title','record-km','record-next-km','record-memo','record-km-before','record-km-after','record-fuel-amount','record-fuel-memo'].forEach(id => document.getElementById(id).value='');
  toggleFuelFields();
  document.getElementById('record-modal').classList.add('open');
}

function toggleFuelFields() {
  const isFuel = document.getElementById('record-category').value==='fuel';
  document.getElementById('fuel-fields').style.display   = isFuel ? 'block' : 'none';
  document.getElementById('normal-fields').style.display = isFuel ? 'none'  : 'block';
}

function updateFuelEfficiencyDisplay() {
  const kmBefore   = parseFloat(document.getElementById('record-km-before').value)||0;
  const kmAfter    = parseFloat(document.getElementById('record-km-after').value)||0;
  const fuelAmount = parseFloat(document.getElementById('record-fuel-amount').value)||0;
  const display = document.getElementById('fuel-efficiency-display');
  if (kmAfter>kmBefore && fuelAmount>0) {
    const eff = ((kmAfter-kmBefore)/fuelAmount).toFixed(1);
    display.textContent = `燃費: ${eff} km/L（走行 ${kmAfter-kmBefore} km）`;
  } else {
    display.textContent = '燃費: 未計算';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  ['record-km-before','record-km-after','record-fuel-amount'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updateFuelEfficiencyDisplay);
  });
});

function closeRecordModal() { document.getElementById('record-modal').classList.remove('open'); }

async function saveRecord() {
  const category = document.getElementById('record-category').value;
  let memo='', km=null;
  if (category==='fuel') {
    const kmBefore=parseFloat(document.getElementById('record-km-before').value);
    const kmAfter =parseFloat(document.getElementById('record-km-after').value);
    const fuelAmt =parseFloat(document.getElementById('record-fuel-amount').value);
    memo = document.getElementById('record-fuel-memo').value;
    if (kmBefore&&kmAfter&&fuelAmt) {
      const dist=kmAfter-kmBefore, eff=(dist/fuelAmt).toFixed(1);
      const autoMemo=`燃費: ${eff} km/L\n走行距離: ${dist} km\n給油量: ${fuelAmt} L`;
      memo = memo?`${autoMemo}\n\n${memo}`:autoMemo;
      km=kmAfter;
      await sb.from('bikes').update({ km: kmAfter }).eq('id', selectedBike.id);
      selectedBike.km = kmAfter;
      const bikeIdx = bikesData.findIndex(b => b.id === selectedBike.id);
      if (bikeIdx !== -1) bikesData[bikeIdx].km = kmAfter;
    }
  } else {
    memo = document.getElementById('record-memo').value;
    km   = parseInt(document.getElementById('record-km').value)||null;
  }
  const payload = {
    user_id: currentUser.id, bike_id: selectedBike.id, category,
    title: document.getElementById('record-title').value,
    date:  document.getElementById('record-date').value,
    km, next_km: category==='fuel'?null:(parseInt(document.getElementById('record-next-km').value)||null), memo
  };
  await sb.from('maintenance_records').insert(payload);
  closeRecordModal();
  renderBikeDetail();
  currentTab=payload.category;
  document.getElementById('current-category-label').textContent=categoryLabels[currentTab];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===['engine','drive','electric','fuel'].indexOf(currentTab)));
  loadRecords();
}

async function deleteRecord(id) {
  if (!confirm('この記録を削除しますか？')) return;
  await sb.from('maintenance_records').delete().eq('id', id);
  loadRecords();
}

// ===== ツーリング記録一覧 =====
function showTouringList() {
  hideAllSections();
  document.getElementById('touring-section').style.display = 'block';
  loadTourings();
}

async function loadTourings() {
  const { data } = await sb.from('touring_records')
    .select('*, bikes(name)')
    .eq('user_id', currentUser.id)
    .order('date', { ascending: false });
  renderTourings(data||[]);
}

function renderTourings(tourings) {
  const list = document.getElementById('touring-list');
  if (tourings.length===0) {
    list.innerHTML = `<div class="empty-msg">まだツーリング記録がありません。「＋ ツーリング追加」から追加してください。</div>`;
    return;
  }
  list.innerHTML = tourings.map(t => `
    <div class="record-item">
      <div>
        <div class="record-title">${t.destination}</div>
        <div class="record-meta">
          ${t.date?`<span>📅 ${t.date}</span>`:''}
          ${t.distance?`<span>📍 ${t.distance} km</span>`:''}
          ${t.bikes?`<span>🏍️ ${t.bikes.name}</span>`:''}
          ${t.companions?`<span>👥 ${t.companions}</span>`:''}
        </div>
        ${t.route?`<div style="font-size:0.8rem;color:var(--text2);margin-top:0.3rem;">📍 ${t.route}</div>`:''}
        ${t.memo?`<div style="font-size:0.8rem;color:var(--text2);margin-top:0.3rem;">📝 ${t.memo}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;">
        ${t.gps_log?`<button class="map-view-btn" onclick="viewTouringMap('${t.id}','${t.destination}')">🗺️ 地図</button>`:''}
        <button class="btn-save" onclick="shareTouring('${t.id}')" style="padding:0.4rem 0.8rem;font-size:0.8rem;">シェア</button>
        <button class="edit-btn" onclick="editTouring('${t.id}')" style="padding:0.4rem 0.8rem;font-size:0.8rem;">✏️ 編集</button>
        <button class="delete-btn" onclick="deleteTouring('${t.id}')">🗑</button>
      </div>
    </div>`).join('');
}

function openTouringModal() {
  editingTouringId = null;
  document.getElementById('touring-modal-title').textContent = 'ツーリング記録を追加';
  document.getElementById('touring-date').value = new Date().toISOString().split('T')[0];
  ['touring-destination','touring-route','touring-distance','touring-companions','touring-memo'].forEach(id=>document.getElementById(id).value='');
  const bikeSelect = document.getElementById('touring-bike');
  bikeSelect.innerHTML = '<option value="">選択なし</option>' + bikesData.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('touring-modal').classList.add('open');
}

async function editTouring(id) {
  const { data: t } = await sb.from('touring_records').select('*').eq('id', id).single();
  if (!t) return;
  editingTouringId = id;
  document.getElementById('touring-modal-title').textContent = 'ツーリング記録を編集';
  const bikeSelect = document.getElementById('touring-bike');
  bikeSelect.innerHTML = '<option value="">選択なし</option>' + bikesData.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('touring-date').value = t.date||'';
  document.getElementById('touring-destination').value = t.destination||'';
  document.getElementById('touring-route').value = t.route||'';
  document.getElementById('touring-distance').value = t.distance||'';
  document.getElementById('touring-bike').value = t.bike_id||'';
  document.getElementById('touring-companions').value = t.companions||'';
  document.getElementById('touring-memo').value = t.memo||'';
  document.getElementById('touring-modal').classList.add('open');
}

function closeTouringModal() { document.getElementById('touring-modal').classList.remove('open'); }

async function saveTouring() {
  const bikeId   = document.getElementById('touring-bike').value||null;
  const distance = parseInt(document.getElementById('touring-distance').value)||null;
  const payload = {
    user_id: currentUser.id, bike_id: bikeId,
    date:        document.getElementById('touring-date').value,
    destination: document.getElementById('touring-destination').value,
    route:       document.getElementById('touring-route').value,
    distance,
    companions:  document.getElementById('touring-companions').value,
    memo:        document.getElementById('touring-memo').value
  };
  if (editingTouringId) {
    await sb.from('touring_records').update(payload).eq('id', editingTouringId);
    editingTouringId = null;
  } else {
    await sb.from('touring_records').insert(payload);
    if (bikeId && distance) {
      const bike = bikesData.find(b=>b.id===bikeId);
      if (bike) await sb.from('bikes').update({ km: (bike.km||0)+distance }).eq('id', bikeId);
    }
  }
  closeTouringModal();
  loadTourings();
  await loadBikes();
}

async function deleteTouring(id) {
  if (!confirm('このツーリング記録を削除しますか?')) return;
  await sb.from('touring_records').delete().eq('id', id);
  loadTourings();
}

async function shareTouring(id) {
  const { data } = await sb.from('touring_records').select('*, bikes(name)').eq('id', id).single();
  if (!data) return;
  const shareText = `🏍️ ツーリング記録\n\n📅 ${data.date}\n📍 ${data.destination}\n${data.route?`🗺️ ${data.route}\n`:''}${data.distance?`📏 ${data.distance} km\n`:''}${data.bikes?`🏍️ ${data.bikes.name}\n`:''}${data.companions?`👥 ${data.companions}\n`:''}${data.memo?`\n${data.memo}\n`:''}\n#マイガレージ #ChainonRiders`;
  if (navigator.share) {
    try { await navigator.share({ title:`ツーリング記録: ${data.destination}`, text:shareText, url:window.location.href }); }
    catch(e) {}
  } else {
    navigator.clipboard.writeText(shareText);
    alert('クリップボードにコピーしました!');
  }
}

// ===== ツーリング記録の地図表示 =====
async function viewTouringMap(id, destination) {
  const { data } = await sb.from('touring_records').select('gps_log').eq('id', id).single();
  if (!data?.gps_log || data.gps_log.length===0) {
    alert('GPS記録がありません');
    return;
  }
  document.getElementById('touring-map-title').textContent = `🗺️ ${destination}`;
  document.getElementById('touring-map-modal').classList.add('open');

  // 地図の初期化（少し遅延させてDOMが確定してから）
  setTimeout(() => {
    if (recordMap) { recordMap.remove(); recordMap=null; }
    const coords = data.gps_log;
    const center = coords[Math.floor(coords.length/2)];
    recordMap = L.map('touring-record-map').setView([center.lat, center.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(recordMap);
    // ルートライン
    const latlngs = coords.map(c=>[c.lat, c.lng]);
    L.polyline(latlngs, { color: '#ff6b00', weight: 4, opacity: 0.8 }).addTo(recordMap);
    // スタート・ゴールマーカー
    L.circleMarker([coords[0].lat, coords[0].lng], { radius:8, color:'#44ff88', fillColor:'#44ff88', fillOpacity:1 })
      .addTo(recordMap).bindPopup('スタート');
    L.circleMarker([coords[coords.length-1].lat, coords[coords.length-1].lng], { radius:8, color:'#ff4444', fillColor:'#ff4444', fillOpacity:1 })
      .addTo(recordMap).bindPopup('ゴール');
    recordMap.fitBounds(latlngs);
  }, 200);
}

function closeTouringMapModal() {
  document.getElementById('touring-map-modal').classList.remove('open');
  if (recordMap) { recordMap.remove(); recordMap=null; }
}

// ===== ツーリングライブ（GPSトラッキング + 位置共有） =====
async function startTouring() {
  if (!navigator.geolocation) {
    alert('お使いのブラウザは位置情報に対応していません');
    return;
  }
  navigator.geolocation.getCurrentPosition(async (position) => {
    isTouring = true;
    liveGpsCoords = [];
    liveTotalDistance = 0;
    liveLastCoord = null;
    liveStartTime = Date.now();

    hideAllSections();
    document.getElementById('touring-live-section').style.display = 'block';

    // Leaflet地図初期化
    if (liveMap) { liveMap.remove(); liveMap=null; }
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    liveMap = L.map('touring-live-map').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(liveMap);

    // 自分のマーカー（オレンジ）
    liveMyMarker = L.circleMarker([lat, lng], {
      radius: 12, color: '#ff6b00', fillColor: '#ff6b00', fillOpacity: 1,
      weight: 3, opacity: 1
    }).addTo(liveMap).bindPopup('あなた');

    // ルートライン
    liveRoutePolyline = L.polyline([], { color: '#ff6b00', weight: 4, opacity: 0.7 }).addTo(liveMap);

    // 最初の座標を追加
    addGpsPoint(lat, lng);

    // 初回位置共有登録
    await updateMyLocationLive(lat, lng);

    // タイマー開始
    liveTimerInterval = setInterval(updateLiveTimer, 1000);

    // GPSウォッチ（移動検知）
    liveLocationWatchId = navigator.geolocation.watchPosition(
      async (pos) => {
        const la = pos.coords.latitude, lo = pos.coords.longitude;
        addGpsPoint(la, lo);
        // マーカー・ルート更新
        liveMyMarker.setLatLng([la, lo]);
        liveRoutePolyline.setLatLngs(liveGpsCoords.map(c=>[c.lat,c.lng]));
        liveMap.panTo([la, lo]);
        // 距離表示更新
        document.getElementById('live-distance').textContent = liveTotalDistance.toFixed(1);
      },
      (err) => console.warn('GPS:', err),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );

    // 3分ごとに位置情報をSupabaseに送信
    liveLocationUpdateInterval = setInterval(async () => {
      if (liveGpsCoords.length>0) {
        const last = liveGpsCoords[liveGpsCoords.length-1];
        await updateMyLocationLive(last.lat, last.lng);
      }
    }, 3*60*1000);

    // 10秒ごとに仲間の位置を取得
    liveParticipantsInterval = setInterval(loadLiveParticipants, 10*1000);
    loadLiveParticipants();

  }, (err) => {
    alert('位置情報の取得に失敗しました。設定を確認してください。');
  });
}

function addGpsPoint(lat, lng) {
  const coord = { lat, lng, ts: Date.now() };
  if (liveLastCoord) {
    liveTotalDistance += calcDistance(liveLastCoord.lat, liveLastCoord.lng, lat, lng);
  }
  liveGpsCoords.push(coord);
  liveLastCoord = coord;
}

// ハバーサイン公式で2点間の距離（km）を計算
function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function updateLiveTimer() {
  if (!liveStartTime) return;
  const elapsed = Math.floor((Date.now()-liveStartTime)/1000);
  const h = Math.floor(elapsed/3600);
  const m = Math.floor((elapsed%3600)/60);
  const s = elapsed%60;
  document.getElementById('live-time').textContent =
    h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function updateMyLocationLive(lat, lng) {
  const userName = currentUser.user_metadata?.full_name || currentUser.email || 'ライダー';
  const today = new Date().toISOString().split('T')[0];
  await sb.from('location_shares').delete().eq('user_id', currentUser.id).eq('session_date', today);
  await sb.from('location_shares').insert({
    user_id: currentUser.id, user_name: userName,
    session_date: today, latitude: lat, longitude: lng
  });
}

async function loadLiveParticipants() {
  const today = new Date().toISOString().split('T')[0];
  const { data } = await sb.from('location_shares').select('*').eq('session_date', today);
  if (!data || !liveMap) return;

  document.getElementById('live-members').textContent = data.length;

  // 参加者バー更新
  const pList = document.getElementById('participants-list');
  pList.innerHTML = data.map(p => {
    const isMe = p.user_id===currentUser.id;
    return `<span class="participant-dot ${isMe?'me':'other'}">🏍️ ${p.user_name}</span>`;
  }).join('');

  // 仲間のマーカー更新
  Object.values(liveMemberMarkers).forEach(m => m.remove());
  liveMemberMarkers = {};
  data.forEach(p => {
    if (p.user_id===currentUser.id) return; // 自分はスキップ
    const marker = L.circleMarker([p.latitude, p.longitude], {
      radius: 10, color: '#44ff88', fillColor: '#44ff88', fillOpacity: 1, weight: 2
    }).addTo(liveMap).bindPopup(`🏍️ ${p.user_name}`);
    liveMemberMarkers[p.user_id] = marker;
  });
}

// 給油検索（Googleマップへ飛ばす）
function searchGasStation() {
  if (liveGpsCoords.length>0) {
    const last = liveGpsCoords[liveGpsCoords.length-1];
    const url = `https://www.google.com/maps/search/ガソリンスタンド/@${last.lat},${last.lng},15z`;
    window.open(url, '_blank');
  } else {
    navigator.geolocation.getCurrentPosition((pos) => {
      const url = `https://www.google.com/maps/search/ガソリンスタンド/@${pos.coords.latitude},${pos.coords.longitude},15z`;
      window.open(url, '_blank');
    });
  }
}

function confirmStopTouring() {
  document.getElementById('stop-destination').value = '';
  document.getElementById('stop-memo').value = '';
  document.getElementById('stop-touring-modal').classList.add('open');
}

async function stopTouringWithSave() {
  document.getElementById('stop-touring-modal').classList.remove('open');
  const destination = document.getElementById('stop-destination').value || 'ツーリング';
  const memo = document.getElementById('stop-memo').value;
  // Supabaseに保存
  await sb.from('touring_records').insert({
    user_id: currentUser.id,
    date: new Date().toISOString().split('T')[0],
    destination,
    distance: Math.round(liveTotalDistance*10)/10,
    memo,
    gps_log: liveGpsCoords   // JSONとして保存
  });
  await cleanupTouring();
  showBikeList();
}

async function stopTouringWithoutSave() {
  document.getElementById('stop-touring-modal').classList.remove('open');
  await cleanupTouring();
  showBikeList();
}

async function cleanupTouring() {
  isTouring = false;
  if (liveTimerInterval)          { clearInterval(liveTimerInterval); liveTimerInterval=null; }
  if (liveLocationUpdateInterval) { clearInterval(liveLocationUpdateInterval); liveLocationUpdateInterval=null; }
  if (liveParticipantsInterval)   { clearInterval(liveParticipantsInterval); liveParticipantsInterval=null; }
  if (liveLocationWatchId!==null) { navigator.geolocation.clearWatch(liveLocationWatchId); liveLocationWatchId=null; }
  // 位置共有データを削除
  const today = new Date().toISOString().split('T')[0];
  await sb.from('location_shares').delete().eq('user_id', currentUser.id).eq('session_date', today);
  if (liveMap) { liveMap.remove(); liveMap=null; }
  liveMyMarker=null; liveRoutePolyline=null; liveGpsCoords=[]; liveMemberMarkers={};
}

init();
</script>
